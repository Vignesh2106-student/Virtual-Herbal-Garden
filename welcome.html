<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Herbal Garden</title>
    <style>
:root {
    --primary: #4ade80;
    --primary-glow: rgba(74, 222, 128, 0.5);
    --bg-overlay: rgba(10, 25, 15, 0.75);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=2074&auto=format&fit=crop') no-repeat center center/cover;
    position: relative;
    overflow: hidden;
}

/* Dark overlay for better contrast */
body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-overlay);
    backdrop-filter: blur(4px);
    z-index: 1;
}

.container {
    position: relative;
    z-index: 2;
    padding: 4rem 6rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.subtitle {
    color: var(--primary);
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 5px;
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.5s;
}

h1 {
    font-size: 4rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1.2;
    margin-bottom: 2.5rem;
    min-height: 96px; /* Prevents layout shift during typing */
    display: flex;
    align-items: center;
    justify-content: center;
}

.highlight {
    color: var(--primary);
    text-shadow: 0 0 25px var(--primary-glow);
}

.cursor {
    display: inline-block;
    width: 4px;
    height: 4rem;
    background-color: var(--primary);
    margin-left: 10px;
    box-shadow: 0 0 15px var(--primary-glow);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

.btn-enter {
    display: inline-block;
    padding: 1.2rem 3rem;
    font-size: 1.2rem;
    font-weight: 600;
    color: #fff;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    transform: translateY(15px);
    pointer-events: none;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
}

.btn-enter.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.btn-enter:hover {
    background: var(--primary);
    color: #052e16;
    border-color: var(--primary);
    box-shadow: 0 0 30px var(--primary-glow);
    transform: translateY(-3px);
}

/* Micro-interactions */
.btn-enter::after {
    content: '→';
    margin-left: 10px;
    transition: margin-left 0.3s ease;
}

.btn-enter:hover::after {
    margin-left: 16px;
}

/* Ambient glowing orbs */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
    opacity: 0.5;
    animation: float 12s infinite alternate ease-in-out;
}

.orb-1 {
    width: 400px;
    height: 400px;
    background: #4ade80;
    top: -100px;
    left: -100px;
}

.orb-2 {
    width: 500px;
    height: 500px;
    background: #0ea5e9;
    bottom: -200px;
    right: -100px;
    animation-delay: -6s;
    animation-duration: 15s;
}

@media (max-width: 768px) {
    h1 { font-size: 2.5rem; min-height: 60px; }
    .cursor { height: 2.5rem; }
    .container { padding: 3rem 2rem; width: 90%; }
}
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="subtitle">Experience Nature</div>
        <h1 id="text-container">
            <span id="text"></span><span class="cursor"></span>
        </h1>
        <a href="start.html" class="btn-enter" id="enter-btn">Explore Garden</a>
    </div>

    <script>
        const message = "Virtual Herbal Garden";
        const textElement = document.getElementById("text");
        const enterBtn = document.getElementById("enter-btn");
        let i = 0;

        function typeEffect() {
            if (i < message.length) {
                let currentText = message.substring(0, i + 1);
                
                // Highlight specific words dynamically
                if (currentText.includes("Herbal Garden")) {
                    currentText = currentText.replace("Herbal Garden", "<span class='highlight'>Herbal Garden</span>");
                } else if (currentText.includes("Herbal")) {
                    currentText = currentText.replace("Herbal", "<span class='highlight'>Herbal</span>");
                }
                
                textElement.innerHTML = currentText;
                i++;
                
                // Randomized typing speed for realism (faster typing)
                const typingSpeed = Math.random() * 40 + 60; 
                setTimeout(typeEffect, typingSpeed);
            } else {
                // Ensure final formatting is solid
                textElement.innerHTML = "Virtual <span class='highlight'>Herbal Garden</span>";
                
                // Show the button shortly after typing finishes
                setTimeout(() => {
                    enterBtn.classList.add("visible");
                }, 400);
            }
        }

        // Start typing effect after initial container fade-in
        setTimeout(typeEffect, 1200);
    </script>

</body>
</html>
